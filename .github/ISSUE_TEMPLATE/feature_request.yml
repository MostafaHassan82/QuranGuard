name: Feature request
description: Suggest a new capability or improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        QuranGuard's north star is **citation integrity**. Features that improve detection, correction, or prevention of altered citations are highest priority; ergonomics and polish come after.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation where today's behavior falls short. Real-world examples beat hypotheticals.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should QuranGuard do instead? Sketch the user-visible behavior, not the implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why this one is better.

  - type: dropdown
    id: side
    attributes:
      label: Which side does this touch?
      options:
        - Reader-side (verification / highlighting / correction)
        - Writer-side (autocomplete / insertion)
        - Both
        - Neither (settings, popup, options UI, etc.)
    validations:
      required: true
