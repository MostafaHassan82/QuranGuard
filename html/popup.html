<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تدقيق آيات القرآن</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <div id="controls">
    <button id="btn-scan">فحص الصفحة</button>
    <button id="btn-clear">مسح التمييز</button>
  </div>

  <div id="status"></div>

  <div id="stats" hidden>
    <div class="stat-row">
      <span class="stat-label">إجمالي النتائج</span>
      <span id="s-total" class="stat-value">0</span>
    </div>

    <div class="stat-row stat-orange">
      <span class="stat-label">⚠ مرجع خاطئ</span>
      <span id="s-orange" class="stat-value">0</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">✓ تطابق تام</span>
      <span id="s-green" class="stat-value">0</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">✓ تطابق بدون مرجع</span>
      <span id="s-lightblue" class="stat-value">0</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">~ اختلاف لفظي</span>
      <span id="s-yellow" class="stat-value">0</span>
    </div>

    <div class="stat-row">
      <span class="stat-label">✗ لم يُتحقَّق</span>
      <span id="s-red" class="stat-value">0</span>
    </div>
  </div>

  <script src="../js/popup.js"></script>
</body>
</html>
