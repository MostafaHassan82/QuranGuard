<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title>تدقيق آيات القرآن</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <!-- Scan trigger toggle (T020) -->
  <div id="trigger-row">
    <label id="trigger-label">وضع الفحص:</label>
    <label class="toggle-option">
      <input type="radio" name="scanTrigger" value="manual" id="trigger-manual" checked>
      <span>يدوي</span>
    </label>
    <label class="toggle-option">
      <input type="radio" name="scanTrigger" value="autoscan" id="trigger-auto">
      <span>تلقائي</span>
    </label>
  </div>

  <div id="controls">
    <button id="btn-scan">فحص الصفحة</button>
    <button id="btn-continue" hidden>متابعة الفحص</button>
    <button id="btn-clear">مسح التمييز</button>
  </div>

  <!-- Progressive reveal status (T029) -->
  <div id="status"></div>
  <div id="progress" hidden>
    <span id="progress-count">0</span> نتيجة حتى الآن…
  </div>

  <div id="stats" hidden>
    <div class="stat-row">
      <span class="stat-label">إجمالي النتائج</span>
      <span id="s-total" class="stat-value">0</span>
    </div>
    <div class="stat-row stat-orange">
      <span class="stat-label">⚠ مرجع خاطئ</span>
      <span id="s-orange" class="stat-value">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">✓ تطابق تام</span>
      <span id="s-green" class="stat-value">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">✓ تطابق بدون مرجع</span>
      <span id="s-lightblue" class="stat-value">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">~ اختلاف لفظي</span>
      <span id="s-yellow" class="stat-value">0</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">✗ لم يُتحقَّق</span>
      <span id="s-red" class="stat-value">0</span>
    </div>
  </div>

  <!-- Filter chips + surface picker (T047) -->
  <div id="panel-controls">
    <div id="filter-chips" role="group" aria-label="تصفية حسب الفئة">
      <label class="filter-chip filter-orange">
        <input type="checkbox" data-color="orange"><span>⚠ مرجع خاطئ</span>
      </label>
      <label class="filter-chip filter-green">
        <input type="checkbox" data-color="green"><span>✓ تطابق تام</span>
      </label>
      <label class="filter-chip filter-lightBlue">
        <input type="checkbox" data-color="lightBlue"><span>✓ بدون مرجع</span>
      </label>
      <label class="filter-chip filter-yellow">
        <input type="checkbox" data-color="yellow"><span>~ اختلاف لفظي</span>
      </label>
      <label class="filter-chip filter-red">
        <input type="checkbox" data-color="red"><span>✗ لم يُتحقَّق</span>
      </label>
    </div>
    <div id="surface-picker">
      <label id="surface-label">سطح اللوحة:</label>
      <label class="toggle-option">
        <input type="radio" name="panelSurface" value="popup" id="surface-popup" checked>
        <span>منبثقة</span>
      </label>
      <label class="toggle-option">
        <input type="radio" name="panelSurface" value="sidebar" id="surface-sidebar">
        <span>شريط جانبي</span>
      </label>
    </div>
  </div>

  <!-- Findings panel (T046) — populated by js/panel/popup-surface.js -->
  <div id="panel-container" role="region" aria-label="نتائج التحقق"></div>

  <script src="../js/shared/messaging.js"></script>
  <script src="../js/panel/model.js"></script>
  <script src="../js/panel/popup-surface.js"></script>
  <script src="../js/popup.js"></script>
</body>
</html>
