<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <title data-i18n="popup_title">تدقيق آيات القرآن</title>
  <link rel="stylesheet" href="../css/popup.css">
</head>
<body>
  <header id="popup-header">
    <h1>
      <span data-i18n="popup_title_a">صَوْنُ</span>
      <span class="gold" data-i18n="popup_title_b">القُرآن</span>
    </h1>
  </header>

  <!-- Diamond-gem divider between header and controls -->
  <div class="popup-divider-ornament" aria-hidden="true">
    <span class="line"></span>
    <span class="gem"></span>
    <span class="line"></span>
  </div>

  <!-- Scan trigger toggle (T020) -->
  <div id="trigger-row">
    <label id="trigger-label" data-i18n="scan_mode">وضع الفحص:</label>
    <label class="toggle-option">
      <input type="radio" name="scanTrigger" value="manual" id="trigger-manual" checked>
      <span data-i18n="manual">يدوي</span>
      <small class="kbd">Manual</small>
    </label>
    <label class="toggle-option">
      <input type="radio" name="scanTrigger" value="autoscan" id="trigger-auto">
      <span data-i18n="auto">تلقائي</span>
      <small class="kbd">Auto</small>
    </label>
  </div>

  <div id="controls">
    <button id="btn-scan" data-i18n="scan_page">فحص الصفحة</button>
    <button id="btn-continue" hidden data-i18n="continue_scan">متابعة الفحص</button>
    <button id="btn-clear" data-i18n="clear_highlights">مسح التمييز</button>
  </div>

  <!-- Progressive reveal status (T029) -->
  <div id="status" role="status" aria-live="polite"></div>
  <div id="progress" hidden>
    <span class="progress-label" data-i18n="progress_suffix">نتيجة حتى الآن…</span>
    <span class="progress-count-wrap">
      <span id="progress-count">0</span>
      <small class="progress-found">found</small>
    </span>
    <span id="progress-suffix" hidden></span>
  </div>

  <!-- FR-020 — data-unavailable error state + Retry (T101) -->
  <div id="data-error" hidden>
    <span id="data-error-msg" role="alert"></span>
    <button id="btn-retry" data-i18n="retry_btn">إعادة المحاولة</button>
  </div>

  <!-- Foot row: keyboard shortcut + Settings link -->
  <div class="popup-foot">
    <span class="popup-shortcut" aria-hidden="true">Alt + Shift + Q</span>
    <button id="btn-settings" data-i18n="settings_btn">⚙ الإعدادات</button>
  </div>

  <script src="../js/shared/messaging.js"></script>
  <script src="../js/shared/i18n.js"></script>
  <script src="../js/popup.js"></script>
</body>
</html>
