<!-- T048 — page-injected sidebar surface (FR-010).
     Markup is fetched at runtime by js/panel/sidebar-surface.js and inserted
     into the host page's <body>. All styles live in css/sidebar.css and are
     namespaced under .quran-ext-panel to prevent host-page CSS bleed.
     [data-i18n*] attributes are filled by QuranI18n.applyDom after mount. -->
<aside class="quran-ext-panel" role="region" data-i18n-aria="panel_region_aria" aria-label="نتائج التحقق من الاقتباسات" aria-keyshortcuts="Alt+Shift+Q">
  <!-- Drag this left edge to widen/narrow the sidebar. -->
  <div class="quran-ext-panel-resize" role="separator" aria-orientation="vertical" data-i18n-aria="resize_aria" aria-label="تغيير العرض"></div>
  <header class="quran-ext-panel-header">
    <h2 class="quran-ext-panel-title">
      <span data-i18n="sidebar_title_a">نتائج</span>
      <span class="gold" data-i18n="sidebar_title_b">التحقق</span>
    </h2>
    <div class="quran-ext-panel-header-btns">
      <!-- Pin: pressed = docked (reserves a gutter, never overlays the page,
           can't be torn off); unpressed = float (overlays, draggable/tearable).
           Icon + aria-pressed set by JS (updatePinButton). -->
      <button type="button" class="quran-ext-panel-pin" data-i18n-aria="pin_unpinned" aria-label="عائمة (يمكن سحبها) — اضغط للتثبيت جانبًا" aria-pressed="false"></button>
      <!-- Collapse/expand handle shown only when the panel is free-floating
           (torn off); docked states use the edge tab. Icon + aria set by JS. -->
      <button type="button" class="quran-ext-panel-float-toggle" data-i18n-aria="collapse_aria" aria-label="طيّ اللوحة" style="display:none"></button>
    </div>
  </header>
  <div class="quran-ext-panel-hint" data-i18n-title="hint_title" data-i18n="hint" title="اضغط Alt+Shift+Q من أي مكان في الصفحة للعودة إلى اللوحة">
    اختصار: Alt+Shift+Q لإظهار/إخفاء اللوحة
  </div>

  <!-- Results summary / stats table (moved from popup; T094). Counts are
       computed from the panel model and rendered by sidebar-surface.js. The
       title row is a button that collapses/expands the counts grid. -->
  <div class="quran-ext-summary">
    <button type="button" class="quran-ext-summary-toggle" aria-expanded="true">
      <span class="quran-ext-summary-title" data-i18n="summary_title">ملخّص النتائج</span>
      <span class="quran-ext-summary-chevron" aria-hidden="true"></span>
    </button>
    <div class="quran-ext-summary-grid"></div>
    <div class="quran-ext-summary-hint" data-i18n="summary_mark_hint">اضغط على فئة لتبديل طريقة تمييزها على الصفحة.</div>
  </div>

  <!-- Quick access to the global authentic-text swap master toggle (the same
       prefs.v1 setting the options page exposes; per-color + font defaults live
       in the options page; T094, FR-009). Item 2 — styled as a chip toggle to
       match the filter chips below; keyboard-toggle wired in sidebar-surface.js. -->
  <label class="quran-ext-swap-row quran-ext-swap-quick" tabindex="0" role="switch" aria-checked="false">
    <input type="checkbox" class="quran-ext-swap-master"><span data-i18n="swap_summary">عرض النص القرآني الأصلي</span>
  </label>

  <!-- Item 1 — Results: a collapsible section (like Results summary) holding the
       category filter chips + the findings list. Only the list scrolls. -->
  <div class="quran-ext-results">
    <button type="button" class="quran-ext-results-toggle" aria-expanded="true">
      <span class="quran-ext-results-title" data-i18n="section_results">النتائج</span>
      <span class="quran-ext-results-chevron" aria-hidden="true"></span>
    </button>
    <div class="quran-ext-results-body">
      <div class="quran-ext-filter-chips" role="group" aria-label="تصفية حسب الفئة">
        <label class="quran-ext-filter-chip quran-ext-filter-orange" tabindex="0">
          <input type="checkbox" data-color="orange"><span data-i18n="chip_orange">⚠ مرجع خاطئ</span>
        </label>
        <label class="quran-ext-filter-chip quran-ext-filter-green" tabindex="0">
          <input type="checkbox" data-color="green"><span data-i18n="chip_green">✓ تطابق تام</span>
        </label>
        <label class="quran-ext-filter-chip quran-ext-filter-lightBlue" tabindex="0">
          <input type="checkbox" data-color="lightBlue"><span data-i18n="chip_lightBlue">✓ بدون مرجع</span>
        </label>
        <label class="quran-ext-filter-chip quran-ext-filter-lightGreen" tabindex="0">
          <input type="checkbox" data-color="lightGreen"><span data-i18n="chip_lightGreen">✎ مُصحَّح</span>
        </label>
        <label class="quran-ext-filter-chip quran-ext-filter-yellow" tabindex="0">
          <input type="checkbox" data-color="yellow"><span data-i18n="chip_yellow">~ اختلاف لفظي</span>
        </label>
        <label class="quran-ext-filter-chip quran-ext-filter-red" tabindex="0">
          <input type="checkbox" data-color="red"><span data-i18n="chip_red">✗ لم يُتحقَّق</span>
        </label>
      </div>

      <div class="quran-ext-panel-container"></div>
    </div>
  </div>
</aside>
